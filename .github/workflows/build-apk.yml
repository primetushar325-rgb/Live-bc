name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/VideoLive.apk
          sha256sum out/VideoLive.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoLive-apk
          path: out/VideoLive.apk
          if-no-files-found: error
