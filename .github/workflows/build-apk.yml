name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "### Build failure log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "^e: |> Task .*FAILED|error:|FAILURE:|Caused by:|What went wrong|Could not|\* What|\* Try" build.log \
              | sort -u | head -30 | sed 's/^/::error::/'
            exit $rc
          fi

      - name: Prepare artifact
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/VideoLive.apk
          sha256sum out/VideoLive.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoLive-apk
          path: out/VideoLive.apk
          if-no-files-found: error

      - name: Publish APK to Releases (direct .apk download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest out/VideoLive.apk \
            --title "Video Live APK (latest build)" \
            --notes "Auto-published APK from branch ${GITHUB_REF_NAME} @ ${GITHUB_SHA}. Download **VideoLive.apk** (Assets below) and install it directly." \
            --latest
